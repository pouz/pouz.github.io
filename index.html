<!DOCTYPE html>
<html>

<head>
  <!-- 서비스 워커 캐싱 정상 활성화 -->
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="유피테크 - 고정밀 SMT 메탈마스크 및 반도체 마스크 정밀 제조 전문 기업">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UPTECH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>UPTECH</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id"
    content="1021275010871-f7ecru4c1fa9hmpmngu2grh3jjo82lma.apps.googleusercontent.com">

  <!-- Google Fonts preconnect and Noto Sans KR font link -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: black;
      margin: 0;
      padding: 0;
    }
    /* Safari에서 Flutter 캔버스 뒷배경 비디오가 보이도록 전체 레이아웃 투명화 */
    flutter-view, flt-glass-pane {
      background: transparent !important;
      background-color: transparent !important;
    }
    #welding-video-bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: linear-gradient(to right, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.15) 100%);
    }
    @media (max-width: 768px) {
      #welding-video-bg-overlay {
        background-image: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.50) 55%, rgba(0,0,0,0.15) 100%);
      }
    }
    #process-video-bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.40) 60%, rgba(0,0,0,0.75) 100%);
    }
    
    /* 로딩 스피너 디자인 */
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #007AFF;
      animation: spin 1s ease-in-out infinite;
      -webkit-animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
    }
    @-webkit-keyframes spin {
      to { -webkit-transform: rotate(360deg); }
    }
  </style>

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLEDFLFCZ3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    // Disable automatic pageviews so GoRouter manual pageviews are recorded correctly
    gtag('config', 'G-BLEDFLFCZ3', { 'send_page_view': false });
  </script>

  <script>
    // Flutter 로딩 전에 미리 정의되도록 head 영역에 선언
    window.setBgVideoVisible = function(visible) {
      var container = document.getElementById('welding-video-bg-container');
      if (container) {
        if (visible) {
          container.style.opacity = '1';
          container.style.zIndex = '-2';
        } else {
          container.style.opacity = '0';
          container.style.zIndex = '-3';
        }
      }
    };

    window.setProcessVideoVisible = function(visible) {
      var container = document.getElementById('process-video-bg-container');
      if (container) {
        if (visible) {
          container.style.opacity = '1';
          container.style.zIndex = '-2';
        } else {
          container.style.opacity = '0';
          container.style.zIndex = '-3';
        }
      }
    };
  </script>
</head>

<body>
  <!-- 엔진 초기화 중 노출될 로딩 스피너 화면 (Flutter 구동 후 JS로 제거) -->
  <div id="loading-indicator" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: black; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.4s ease-in-out;">
    <div class="spinner"></div>
    <div style="color: #cccccc; margin-top: 24px; font-family: 'Noto Sans KR', sans-serif; font-size: 15px; letter-spacing: 0.5px; font-weight: 300;">UPTECH 로딩 중...</div>
  </div>

  <!-- 사파리 WebGL 컴포지팅 한계를 우회하기 위한 네이티브 백그라운드 비디오 레이어 (상시 display:block으로 유지하고 opacity와 z-index로 렌더 토글) -->
  <div id="welding-video-bg-container" style="opacity: 0; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; overflow: hidden; background-color: black; transition: opacity 0.4s ease-in-out;">
    <video id="welding-video-bg" src="assets/assets/images/welding_loop.mp4" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover; border: none;"></video>
    <div id="welding-video-bg-overlay"></div>
  </div>

  <!-- 사파리 나노코팅 공정 화면 우회를 위한 두 번째 비디오 레이어 (상시 display:block으로 유지하고 opacity와 z-index로 렌더 토글) -->
  <div id="process-video-bg-container" style="opacity: 0; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; overflow: hidden; background-color: black; transition: opacity 0.4s ease-in-out;">
    <video id="process-video-bg" src="assets/assets/images/P1001438.mp4" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover; border: none;"></video>
    <div id="process-video-bg-overlay"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
