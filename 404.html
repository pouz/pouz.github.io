<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UPTECH</title>
  <script type="text/javascript">
    // ─────────────────────────────────────────────────────────────────────────
    // GitHub Pages SPA 라우팅 리디렉션 트리거 (404 우회 기법)
    // ─────────────────────────────────────────────────────────────────────────
    // 이 스크립트는 404가 발생했을 때 현재의 실제 요청 경로(Path)를 쿼리 파라미터(?p=...)로 
    // 치환하여 루트의 index.html로 리다이렉트시킵니다.
    // repository_name(깃허브 저장소명)이 도메인 하위에 1단계로 포함되므로 pathSegmentsToKeep = 1로 설정합니다.
    var pathSegmentsToKeep = 1;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
