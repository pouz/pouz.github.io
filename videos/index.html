<!DOCTYPE html>
<html>

<head>
  <!-- 서비스 워커 캐싱 정상 활성화 -->
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="유피테크 - 고정밀 SMT 메탈마스크 및 반도체 마스크 정밀 제조 전문 기업">
  <meta name="keywords"
    content="유피테크, UPTech, 메탈마스크, 단차마스크, SMT 메탈마스크, 반도체 마스크, 나노 코팅, 정밀 레이저 가공, 레이저 용접, 스텐실, SMT 스텐실, 스텝마스크, Step Mask, 스텝업, 스텝다운, SUS 패치, 에칭 단차마스크, 웨이퍼 마스크, 특수마스크, UV 레이저 라우팅, SMT 공정, PCB 조립, 표면실장기술, 초미세 실장 공정, 스마트 팩토리">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="유피테크 - 고정밀 SMT 메탈마스크 및 반도체 마스크 정밀 제조 전문 기업">
  <meta property="og:description"
    content="독자적인 단차마스크(step, multi-level)및 특수 나노 코팅 기술력을 바탕으로, 초미세 실장에 최적화된 고품질 SMT 메탈마스크와 단차마스크(Step Stencil)를 제작합니다.">
  <meta property="og:image" content="assets/assets/logo/logo.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UPTECH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>UPTECH</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id"
    content="1021275010871-f7ecru4c1fa9hmpmngu2grh3jjo82lma.apps.googleusercontent.com">

  <!-- Google Fonts preconnect and Noto Sans KR font link -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: black;
      margin: 0;
      padding: 0;
    }

    /* Safari에서 Flutter 캔버스 뒷배경 비디오가 보이도록 전체 레이아웃 투명화 */
    flutter-view,
    flt-glass-pane {
      background: transparent !important;
      background-color: transparent !important;
    }

    #welding-video-bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: linear-gradient(to right, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.55) 55%, rgba(0, 0, 0, 0.15) 100%);
    }

    @media (max-width: 768px) {
      #welding-video-bg-overlay {
        background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.50) 55%, rgba(0, 0, 0, 0.15) 100%);
      }
    }

    #process-video-bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.40) 60%, rgba(0, 0, 0, 0.75) 100%);
    }

    /* 로고 차오름 로더 디자인 */
    .logo-loader-container {
      position: relative;
      width: 140px;
      height: 140px;
    }

    .logo-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('assets/assets/logo/logo.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.12;
      filter: grayscale(100%);
    }

    .logo-fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('assets/assets/logo/logo.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      animation: fill-logo 2.5s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
      -webkit-animation: fill-logo 2.5s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
    }

    @keyframes fill-logo {
      0% {
        clip-path: inset(100% 0 0 0);
      }

      65% {
        clip-path: inset(0 0 0 0);
      }

      90% {
        clip-path: inset(0 0 0 0);
        opacity: 1;
      }

      100% {
        clip-path: inset(0 0 0 0);
        opacity: 0;
      }
    }

    @-webkit-keyframes fill-logo {
      0% {
        -webkit-clip-path: inset(100% 0 0 0);
      }

      65% {
        -webkit-clip-path: inset(0 0 0 0);
      }

      90% {
        -webkit-clip-path: inset(0 0 0 0);
        opacity: 1;
      }

      100% {
        -webkit-clip-path: inset(0 0 0 0);
        opacity: 0;
      }
    }
  </style>

  <!-- Global site tag (gtag.js) - Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BLEDFLFCZ3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    // Disable automatic pageviews so GoRouter manual pageviews are recorded correctly
    gtag('config', 'G-BLEDFLFCZ3', { 'send_page_view': false });
  </script>

  <script>
    // Flutter 로딩 전에 미리 정의되도록 head 영역에 선언
    window.setBgVideoVisible = function (visible) {
      var container = document.getElementById('welding-video-bg-container');
      var video = document.getElementById('welding-video-bg');
      if (container) {
        if (visible) {
          container.style.opacity = '1';
          container.style.zIndex = '-2';
          if (video && video.paused) {
            video.play().catch(function (e) {
              console.log("Welding video play blocked/failed: ", e);
            });
          }
        } else {
          container.style.opacity = '0';
          container.style.zIndex = '-3';
          if (video && !video.paused) {
            video.pause();
          }
        }
      }
    };

    window.setProcessVideoVisible = function (visible) {
      var container = document.getElementById('process-video-bg-container');
      var video = document.getElementById('process-video-bg');
      if (container) {
        if (visible) {
          container.style.opacity = '1';
          container.style.zIndex = '-2';
          if (video && video.paused) {
            video.play().catch(function (e) {
              console.log("Process video play blocked/failed: ", e);
            });
          }
        } else {
          container.style.opacity = '0';
          container.style.zIndex = '-3';
          if (video && !video.paused) {
            video.pause();
          }
        }
      }
    };

    // 사파리 자동재생 차단을 우회하기 위한 첫 사용자 동작(클릭/터치/스크롤) 감지 시 미디어 재생 활성화
    function playAllVideosOnGesture() {
      var v1 = document.getElementById('welding-video-bg');
      var v2 = document.getElementById('process-video-bg');
      if (v1 && v1.paused) v1.play().catch(function (e) { });
      if (v2 && v2.paused) v2.play().catch(function (e) { });

      // 일회성 실행이므로 모든 리스너 제거
      window.removeEventListener('click', playAllVideosOnGesture);
      window.removeEventListener('touchstart', playAllVideosOnGesture);
      window.removeEventListener('scroll', playAllVideosOnGesture);
      window.removeEventListener('wheel', playAllVideosOnGesture);
    }
    window.addEventListener('click', playAllVideosOnGesture);
    window.addEventListener('touchstart', playAllVideosOnGesture);
    window.addEventListener('scroll', playAllVideosOnGesture);
    window.addEventListener('wheel', playAllVideosOnGesture);

    // base href를 기반으로 비디오 src 경로를 동적으로 세팅하는 함수 (상대경로가 서브라우트에서 404 나는 현상 해결)
    function initVideoSrcPaths() {
      var baseElement = document.querySelector('base');
      var basePath = '/';
      if (baseElement) {
        var href = baseElement.getAttribute('href');
        if (href) {
          basePath = href;
          if (basePath.indexOf('$') !== -1) {
            basePath = '/';
          }
          if (!basePath.startsWith('/')) basePath = '/' + basePath;
          if (!basePath.endsWith('/')) basePath = basePath + '/';
        }
      }

      // 만약 basePath가 '/'가 아니라면 (예: 서브경로 호스팅), 절대경로를 다시 매핑해줍니다.
      if (basePath !== '/') {
        var v1 = document.getElementById('welding-video-bg');
        if (v1) {
          v1.src = basePath + 'assets/assets/images/welding_loop.mp4';
        }
        var v2 = document.getElementById('process-video-bg');
        if (v2) {
          v2.src = basePath + 'assets/assets/images/P1001438.mp4';
        }
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initVideoSrcPaths);
    } else {
      initVideoSrcPaths();
    }

    // 사파리 BFCache(뒤로/앞으로가기 캐시) 복원 시 로딩창이 화면을 차단하는 현상 완전 방지
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        var indicator = document.getElementById('loading-indicator');
        if (indicator) {
          indicator.style.display = 'none';
          indicator.remove();
        }
      }
    });
  </script>
</head>

<body>
  <!-- 엔진 초기화 중 노출될 로고 차오름 로딩 화면 (Flutter 구동 후 JS로 제거) -->
  <div id="loading-indicator"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: black; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.4s ease-in-out;">
    <div class="logo-loader-container">
      <div class="logo-bg"></div>
      <div class="logo-fill"></div>
    </div>
  </div>

  <!-- 사파리 WebGL 컴포지팅 한계를 우회하기 위한 네이티브 백그라운드 비디오 레이어 (상시 display:block으로 유지하고 opacity와 z-index로 렌더 토글) -->
  <div id="welding-video-bg-container"
    style="opacity: 0; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; overflow: hidden; background-color: black; transition: opacity 0.4s ease-in-out;">
    <video id="welding-video-bg" src="/assets/assets/images/welding_loop.mp4" autoplay loop muted playsinline preload="none"
      style="width: 100%; height: 100%; object-fit: cover; border: none;"></video>
    <div id="welding-video-bg-overlay"></div>
  </div>

  <!-- 사파리 나노코팅 공정 화면 우회를 위한 두 번째 비디오 레이어 (상시 display:block으로 유지하고 opacity와 z-index로 렌더 토글) -->
  <div id="process-video-bg-container"
    style="opacity: 0; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3; overflow: hidden; background-color: black; transition: opacity 0.4s ease-in-out;">
    <video id="process-video-bg" src="/assets/assets/images/P1001438.mp4" autoplay loop muted playsinline preload="none"
      style="width: 100%; height: 100%; object-fit: cover; border: none;"></video>
    <div id="process-video-bg-overlay"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Flutter 첫 프레임 렌더링 감지 시 로고 로더를 안전하게 제거하는 함수
    function hideLoadingIndicator() {
      var indicator = document.getElementById('loading-indicator');
      if (indicator) {
        indicator.style.opacity = '0';
        setTimeout(function () {
          if (indicator && indicator.parentNode) {
            indicator.parentNode.removeChild(indicator);
          }
        }, 400);
      }
    }

    // 1. Flutter 첫 프레임 커스텀 이벤트 감지
    window.addEventListener('flutter-first-frame', hideLoadingIndicator);

    // 2. 네트워크 지연 및 엔진 초기화 지연 방지를 위한 2.5초 강제 제거 안전 타이머
    setTimeout(hideLoadingIndicator, 2500);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
